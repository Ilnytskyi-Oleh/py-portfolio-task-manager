services:
  db:
    image: postgres:16-alpine
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_manager}
      POSTGRES_USER: ${POSTGRES_USER:-task_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bind only to localhost when publishing for local tools.
    # Leave POSTGRES_PUBLISH_PORT empty to keep DB internal-only.
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-task_manager} -d ${POSTGRES_DB:-task_manager}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  web-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
      args:
        PYTHON_VERSION: "3.12"
    entrypoint: ["sh", "/app/docker/entrypoint.sh"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SEED_DEMO: ${SEED_DEMO:-1}
    volumes:
      - .:/app
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
      args:
        PYTHON_VERSION: "3.12"
    entrypoint: ["sh", "/app/docker/entrypoint.sh"]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      RUN_COLLECTSTATIC: "1"
      SEED_DEMO: "0"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-1}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
