{% load i18n %}
<div class="prefs-panel">
  <div class="prefs-group">
    <span class="prefs-label">{% trans "Language" %}</span>
    <form action="{% url 'set_language' %}" method="post" class="lang-switch">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      {% get_current_language as LANGUAGE_CODE %}
      <div class="prefs-segment" role="group" aria-label="{% trans 'Language' %}">
        {% for code, name in LANGUAGES %}
          <button
            type="submit"
            name="language"
            value="{{ code }}"
            class="prefs-seg{% if code == LANGUAGE_CODE %} is-active{% endif %}"
            title="{{ name }}"
            aria-pressed="{% if code == LANGUAGE_CODE %}true{% else %}false{% endif %}"
          >
            {{ code|upper }}
          </button>
        {% endfor %}
      </div>
    </form>
  </div>

  <div class="prefs-group">
    <span class="prefs-label">{% trans "Theme" %}</span>
    <div class="prefs-segment" role="group" aria-label="{% trans 'Theme' %}">
      <button
        type="button"
        class="prefs-seg"
        data-theme-set="light"
        aria-pressed="false"
      >
        {% trans "Light" %}
      </button>
      <button
        type="button"
        class="prefs-seg"
        data-theme-set="dark"
        aria-pressed="false"
      >
        {% trans "Dark" %}
      </button>
    </div>
  </div>
</div>
