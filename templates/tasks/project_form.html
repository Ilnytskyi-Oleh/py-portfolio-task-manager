{% extends "base.html" %}

{% block title %}<title>Project form — Task Manager</title>{% endblock %}

{% block content %}
  <h1 class="mb-3">
    {% if object %}Edit project{% else %}Create project{% endif %}
  </h1>
  <form method="post" class="card task-card card-body">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">
          {{ field.label }}
        </label>
        {{ field.errors }}
        {{ field }}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
{% endblock %}
