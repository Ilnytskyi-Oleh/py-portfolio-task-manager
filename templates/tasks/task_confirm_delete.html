{% extends "base.html" %}

{% block title %}<title>Delete task — TAKT</title>{% endblock %}

{% block content %}
  <div class="page-header">
    <div>
      <h1 class="mb-1">Delete task</h1>
      <p class="page-lede mb-0">This action cannot be undone.</p>
    </div>
  </div>
  <div class="confirm-panel">
    <p class="mb-4">
      Delete <strong>{{ object.name }}</strong>? You will not be able to restore it.
    </p>
    <form method="post" class="d-flex flex-wrap gap-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete task</button>
      <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">
        Cancel
      </a>
    </form>
  </div>
{% endblock %}
